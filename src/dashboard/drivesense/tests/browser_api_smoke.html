<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>DriveSense offline browser API smoke test</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 24px; }
  iframe { width: 100%; height: 520px; border: 1px solid #aaa; }
  #result { white-space: pre-wrap; }
</style>
<h1>DriveSense 离线接口检查</h1>
<pre id="result">RUNNING</pre>
<iframe id="demo" title="DriveSense demo" src="../index.html?smoke=1#camera"></iframe>
<script>
(function () {
  "use strict";
  const result = document.getElementById("result");
  const frame = document.getElementById("demo");
  const checks = [];
  function check(name, actual, expected) {
    if (actual !== expected) throw new Error(`${name}: expected ${expected}, got ${actual}`);
    checks.push(`PASS ${name}`);
  }
  frame.addEventListener("load", () => {
    try {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      win.DriveCameraView.pushPacket({mode:"REPLAY",connected:true,
        camera:{kind:"CAMERA",sequence:1,image_mode:2,live:1,configured:1,width:640,height:480,age_ms:0,stale:false,source:"REPLAY"},
        obstacles:{kind:"OBSTACLE",result_seq:1,source_frame:42,state:0,available:1,age_ms:0,proc_ms:4,count:1,boxes:[{id:7,xmin:32,ymin:40,xmax:200,ymax:220}],stale:false,valid:1,source:"REPLAY"}});
      check("hardware image mode",doc.getElementById("cvBoardImageMode").textContent,"灰度图像");
      check("native detection count",doc.getElementById("cvObstacleCount").textContent,"1");
      check("native coordinate box",doc.querySelectorAll("#cvObstacleBoxes .cv-obstacle-box").length,1);
      check("metadata source marked replay",doc.getElementById("cvObstacleSource").textContent,"REPLAY · 回放数据");
      check("no fake browser camera",doc.querySelectorAll(".cv-scene, .cv-live-image").length,0);
      win.DriveCameraView.disconnect();
      check("disconnect clears boxes",doc.querySelectorAll("#cvObstacleBoxes .cv-obstacle-box").length,0);
      win.DriveDemo.pushFrame({ roll: -12, pitch: 4, heading: 85, distance: 0.25 });
      win.location.hash = "#sensors";
      setTimeout(() => {
        try {
          check("sensor page route", doc.title, "DriveSense — Sensors Demo");
          check("shared distance threshold", doc.getElementById("distanceState").textContent, "DANGER");
          result.textContent = checks.join("\n") + `\nPASS ${checks.length}/${checks.length}`;
          result.style.color = "#077a39";
        } catch (error) {
          result.textContent = checks.join("\n") + `\nFAIL ${error.message}`;
          result.style.color = "#c00";
        }
      }, 250);
    } catch (error) {
      result.textContent = checks.join("\n") + `\nFAIL ${error.message}`;
      result.style.color = "#c00";
    }
  }, { once: true });
})();
</script>
</html>
